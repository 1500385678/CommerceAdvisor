<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>05 · 商务趣味与游戏 · CommerceAdvisor</title>
  <style>
    :root { --fg: #1a1a1a; --bg: #fafafa; --accent: #2c5f8d; --muted: #666; --border: #e0e0e0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Helvetica Neue", "PingFang SC", sans-serif;
           color: var(--fg); background: var(--bg); line-height: 1.6; padding: 2rem; }
    header { max-width: 960px; margin: 0 auto 1.5rem; padding-bottom: 0.8rem; border-bottom: 1px solid #ddd; }
    h1 { font-size: 1.6rem; color: var(--accent); margin-bottom: 0.3rem; }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); }
    .breadcrumb a { color: var(--accent); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .badge { display: inline-block; font-size: 0.7rem; color: var(--bg); background: var(--accent);
             padding: 0.15rem 0.5rem; border-radius: 3px; margin-left: 0.5rem; vertical-align: middle; }
    main { max-width: 960px; margin: 0 auto; }
    .intro { color: var(--muted); margin-bottom: 1rem; font-size: 0.9rem; }
    .frame-wrap { border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
                  background: #fff; margin-bottom: 1rem; }
    .frame-wrap iframe { display: block; width: 100%; height: 60vh; border: 0; }
    .widget { border: 1px dashed var(--accent); border-radius: 6px; padding: 1rem;
              background: #f4f8fc; margin-bottom: 1rem; }
    .widget h2 { font-size: 1rem; color: var(--accent); margin-bottom: 0.5rem; }
    .widget p { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.8rem; }
    .widget .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .widget select, .widget button { font: inherit; padding: 0.3rem 0.6rem;
            border: 1px solid var(--border); border-radius: 4px; background: #fff; color: var(--fg); }
    .widget button { cursor: pointer; }
    .widget button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .widget .out { margin-top: 0.8rem; font-size: 0.95rem; color: var(--fg);
                   min-height: 1.5em; }
    footer { max-width: 960px; margin: 2rem auto 0; padding-top: 1rem; border-top: 1px solid #ddd;
             font-size: 0.8rem; color: var(--muted); text-align: center; }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>05 · 商务趣味与游戏<span class="badge">P1.6 · 2026-09-06 破零</span></h1>
    <p class="breadcrumb"><a href="index.html">首页</a> › 05 · 商务趣味与游戏</p>
  </header>
  <main>
    <p class="intro">商务游戏设计 · 趣味实验 · 互动小工具 · 只读引用 _CommerceLib 资料库(P0.6 配套)</p>
    <div class="frame-wrap">
      <iframe
        src="../_CommerceLib/05_商务趣味与游戏/商务趣味与游戏.md"
        title="商务趣味与游戏"
      ></iframe>
    </div>
    <section class="widget" aria-label="互动小工具占位 · 囚徒困境演示">
      <h2>互动小工具 · 囚徒困境一次性演示(纯静态版)</h2>
      <p>Phase 1 空壳阶段占位 — 两个玩家选「合作」或「背叛」,展示经典囚徒困境收益矩阵。Phase 2 接入 <code>marked.js</code> + 完整博弈树。</p>
      <div class="row">
        <label>玩家 A:
          <select id="playerA">
            <option value="C">合作</option>
            <option value="D">背叛</option>
          </select>
        </label>
        <label>玩家 B:
          <select id="playerB">
            <option value="C">合作</option>
            <option value="D">背叛</option>
          </select>
        </label>
        <button class="primary" id="playBtn">演示</button>
      </div>
      <div class="out" id="out">等待演示…</div>
    </section>
  </main>
  <footer>
    <a href="index.html">← 返回首页</a> · 静态站点 · 零依赖
  </footer>
  <script>
    // 经典囚徒困境收益矩阵(R=奖励,T=诱惑,S=受罚,P=惩罚)
    var payoffs = {
      "CC": "双方合作 → 双方得 R(3,3)",
      "CD": "A 合作 B 背叛 → A 得 S(0,4)",
      "DC": "A 背叛 B 合作 → A 得 T(4,0)",
      "DD": "双方背叛 → 双方得 P(1,1)"
    };
    document.getElementById("playBtn").addEventListener("click", function () {
      var a = document.getElementById("playerA").value;
      var b = document.getElementById("playerB").value;
      document.getElementById("out").textContent = payoffs[a + b] || "无效输入";
    });
  </script>
</body>
</html>
